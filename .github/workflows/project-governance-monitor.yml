name: Mega Board project governance monitor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - project/drift_monitor.py
      - project/test_drift_monitor.py
      - project/feature_registry.json
      - .github/workflows/project-governance-monitor.yml
  schedule:
    - cron: "19 11 * * *"
permissions:
  contents: write
  issues: write
concurrency:
  group: mega-board-governance-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read canonical newest decision register
        run: |
          git fetch --depth=1 origin main
          git reset --hard origin/main
      - name: Regression-test monitor and decision authority safeguards
        run: |
          python -m unittest discover -s project -p 'test_register.py' -v
          python -m unittest discover -s project -p 'test_drift_monitor.py' -v
      - name: Compare actual five-league GitHub state with approved requirements
        id: audit
        continue-on-error: true
        run: python -u project/drift_monitor.py
      - name: Publish observed governance status without editing decisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/monitor_status.json project/STATUS.md
          if git diff --cached --quiet; then
            echo "Governance monitor status already current"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Record observed Mega Board governance status"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main
            sleep 2
          done
          exit 1
      - name: Open or resolve one GitHub issue when project behavior drifts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
        run: |
          title="Mega Board project drift detected"
          number="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Mega Board project drift detected") | .number' | head -n 1)"
          if [[ "$AUDIT_RESULT" != "success" ]]; then
            if [[ -n "$number" ]]; then
              gh issue edit "$number" --body-file project/STATUS.md
              echo "Updated drift issue #$number"
            else
              gh issue create --title "$title" --body-file project/STATUS.md
            fi
          elif [[ -n "$number" ]]; then
            gh issue close "$number" --comment "Automatic governance check passed; drift resolved. The decision register was not changed."
          else
            echo "No governance drift; no issue needed."
          fi
      - name: Do not show green if governance audit was inconclusive or failed
        if: steps.audit.outcome != 'success'
        run: |
          echo "::error::Implementation drift or incomplete source validation; review project/STATUS.md"
          exit 1
