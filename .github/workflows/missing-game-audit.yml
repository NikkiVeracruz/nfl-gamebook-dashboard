name: Independent missing-game audit (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: read-only-missing-game-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compare published game IDs and counts with league schedules
        run: python tests/missing_game_audit.py
      - name: Flag completed NFL games still missing their official gamebook
        if: always()
        run: python tests/nfl_final_gamebooks.py
