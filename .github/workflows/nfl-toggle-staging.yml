name: NFL action-toggle rehearsal (staging)
on:
  push:
    branches: [staging-nfl-action-toggle-2026-11-22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyyaml
      - name: Check all NFL workflow syntax and scoped permissions
        run: |
          python - <<'PY'
          import yaml
          files = (".github/workflows/update.yml",
                   ".github/workflows/nfl-calendar.yml",
                   ".github/workflows/nfl-manual-update.yml")
          for name in files:
              with open(name) as fp:
                  workflow = yaml.safe_load(fp)
              assert "jobs" in workflow
          print("All workflow YAML files parsed successfully")
          PY
          python -m py_compile nfl_calendar.py monitor.py archive.py
      - name: Test calendar cutoffs, missing PDFs, and archive safety
        run: |
          python -m unittest discover -s tests -p 'test_nfl_calendar.py' -v
          python -m unittest discover -s tests -p 'test_nfl_older_pdf_recovery.py' -v
          python -m unittest discover -s tests -p 'test_archive_safety.py' -v
      - name: Fetch current NFL game schedule without editing workflow definitions
        run: python nfl_calendar.py refresh
      - name: Assert dynamic workflow modifications and archive changes are impossible
        run: |
          git diff --exit-code -- .github/workflows/update.yml .github/workflows/nfl-calendar.yml archive.json gamebooks.json archive-progress.json
          echo "PASS: only the lightweight game-date cache may change"
