name: WNBA archive team filtering regression (staging)
on:
  push:
    branches: [staging-wnba-archive-team-dropdown-2026-11-23]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Check archive team extraction and browser syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("command-center/index.html").read_text()
          start=text.index("<script>")+len("<script>")
          end=text.index("</script>",start)
          Path("/tmp/mega-archive.js").write_text(text[start:end])
          assert 'String(g.label||"").split(/\\s+@\\s+/)' in text
          assert "history-disclosure" in text
          assert "refreshHistoryFilters(autoExpand=false)" in text
          PY
          node --check /tmp/mega-archive.js
          node - <<'JS'
          const labels=[
            {label:"Atlanta Dream @ Golden State Valkyries"},
            {label:"Indiana Fever @ Chicago Sky"},
            {label:"Seattle Storm @ Portland Fire"}
          ];
          const names=[...new Set(labels.flatMap(g=>[g.home_team,g.away_team,...String(g.label||"").split(/\s+@\s+/)]).map(x=>String(x||"").trim()).filter(Boolean))];
          for(const expected of ["Atlanta Dream","Golden State Valkyries","Indiana Fever","Chicago Sky","Seattle Storm","Portland Fire"]){
            if(!names.includes(expected))process.exit(1);
          }
          console.log("WNBA team selection includes every team in archived matchups");
          JS
      - name: Ensure archives not modified
        run: git diff --exit-code -- archive.json gamebooks.json
