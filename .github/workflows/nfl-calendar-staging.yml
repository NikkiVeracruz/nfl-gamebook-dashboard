name: NFL calendar-aware polling rehearsal (staging)
on:
  push:
    branches: [staging-nfl-calendar-polling-2026-11-22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyyaml
      - name: Check source and workflow syntax
        run: |
          python -m py_compile nfl_calendar.py monitor.py archive.py tests/test_nfl_calendar.py
          python - <<'PY'
          import yaml
          for path in (".github/workflows/update.yml", ".github/workflows/nfl-calendar.yml"):
              with open(path) as f:
                  obj = yaml.safe_load(f)
              assert "jobs" in obj
              assert obj.get(True, {}).get("schedule") or "nfl-calendar.yml" in path
          print("Workflow YAML syntax valid")
          PY
      - name: Run NFL calendar and archive safety tests
        run: |
          python -m unittest discover -s tests -p 'test_nfl_calendar.py' -v
          python -m unittest discover -s tests -p 'test_archive_safety.py' -v
      - name: Rebuild active dates against ESPN without touching production
        run: python nfl_calendar.py refresh
      - name: Verify the calendar is stable and only schedule files change
        run: |
          git diff --exit-code -- archive.json gamebooks.json monitor-state.json archive-progress.json
          python nfl_calendar.py refresh
          git diff --exit-code -- archive.json gamebooks.json monitor-state.json archive-progress.json
          echo "PASS: read-only calendar rehearsal; production archive untouched"
