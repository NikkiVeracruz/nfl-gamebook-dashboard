name: Update NCAA Forward Archive
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
jobs:
  football:
    uses: ./.github/workflows/ncaa-league.yml
    with:
      league: ncaaf
      sport: NCAAF
  mens_basketball:
    uses: ./.github/workflows/ncaa-league.yml
    with:
      league: ncaamb
      sport: NCAAMB
  womens_basketball:
    uses: ./.github/workflows/ncaa-league.yml
    with:
      league: ncaawb
      sport: NCAAWB
