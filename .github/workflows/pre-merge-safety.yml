# Runs only on proposed merges; cannot write data or publish a dashboard.
# Existing live monitoring, notifications, deployment and post-merge checks are unchanged.
name: Pre-merge safety checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pre-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install league monitor dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure production monitor code compiles
        run: python -m py_compile archive.py forward_only.py monitor.py
      - name: Preserve complete-report forward-only retention
        run: python -m unittest discover -s tests -p 'test_forward_only.py' -v
      - name: Preserve archive integrity safeguards
        run: python -m unittest discover -s tests -p 'test_archive_safety.py' -v
      - name: Search and page integration regression tests
        run: |
          node --check command-center/search.js
          node --test tests/test_mega_search.cjs
          python - <<'PY'
          from pathlib import Path
          html=Path("command-center/index.html").read_text()
          for required in ('src="./search.js"', 'MegaSearch.getTeams', 'MegaSearch.matchesQuery', 'MegaSearch.matchesSelectedTeam'):
              assert required in html, f"Missing Mega Board search integration: {required}"
          assert 'ARCHIVE_TEAMS=' not in html
          assert 'NCAA' not in html
          PY
      - name: Regenerate the readable register for a coherent staging test
        run: |
          python project/render_register.py --write
          python project/render_register.py --check
      - name: Test registered decisions and drift-monitor code
        run: |
          python -m unittest discover -s project -p 'test_register.py' -v
          python -m unittest discover -s project -p 'test_drift_monitor.py' -v
