name: Read-only backfill verification (staging)
on:
  push:
    branches: [staging-archive-safety-2026-11-22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch latest production baseline
        run: git fetch --no-tags --depth=1 origin main
      - name: Copy production NFL archive to scratch checkout
        run: |
          git show FETCH_HEAD:archive.json > archive.json
          git show FETCH_HEAD:archive-progress.json > archive-progress.json

      - name: Exercise a missing 2025 regular-season batch in scratch checkout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("archive-progress.json")
          data = json.loads(path.read_text())
          data["next_date"] = "2025-11-02"  # Historical data gap, scratch only
          data["complete"] = False
          path.write_text(json.dumps(data, indent=2) + "\n")
          print("Scratch-only backfill cursor:", data["next_date"])
          PY

      - name: Execute the real NFL historical backfill script without publishing
        env:
          ARCHIVE_LEAGUE: nfl
        run: timeout 510s python backfill.py
      - name: Restore original production progress cursor in scratch checkout
        run: git show FETCH_HEAD:archive-progress.json > archive-progress.json
      - name: Check against latest untouched production archive
        run: python tests/archive_integrity_gate.py archive.json --baseline-ref FETCH_HEAD
      - name: Enforce exactly sixty reviewed November games and distinct official PDFs
        run: python tests/validate_nfl_nov_2025_recovery.py FETCH_HEAD
      - name: Summarize proposed historical recovery before any publication
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          before = json.loads(subprocess.check_output(
              ["git", "show", "FETCH_HEAD:archive.json"], text=True
          ))
          after = json.loads(Path("archive.json").read_text())
          def key(g):
              return str(g.get("id") or g.get("slug") or
                         (str(g.get("date", "")) + "|" + str(g.get("label", ""))))
          prior = {key(g): g for g in before["games"]}
          proposed = {key(g): g for g in after["games"]}
          new = [g for key_, g in proposed.items() if key_ not in prior]
          in_window = [
              g for g in new if "2025-11-02" <= g.get("date", "") < "2025-11-30"
          ]
          linked = [g for g in in_window if g.get("pdf_url")]
          missing = [g for g in in_window if not g.get("pdf_url")]
          report = [
              "## NFL November 2025 read-only recovery preview",
              "",
              f"- Production baseline: {len(prior)} games",
              f"- Proposed archive: {len(proposed)} games",
              f"- New game records: {len(new)}",
              f"- New games in Nov 2–29, 2025: {len(in_window)}",
              f"- New games with verified official PDFs: {len(linked)}",
              f"- New games awaiting PDFs: {len(missing)}",
              "",
              "### Sample proposed games",
              "| Date | Matchup | PDF |",
              "|---|---|---|",
          ]
          report += [
              f"| {g.get('date', '')} | {str(g.get('label', '')).replace('|','/')} | "
              + ("Yes" if g.get("pdf_url") else "No") + " |"
              for g in sorted(in_window, key=lambda x: x.get("date", ""))[:20]
          ]
          text = "\n".join(report) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(text)
          if not in_window:
              raise SystemExit("FAIL: no missing November 2025 games recovered")
          if len(new) != len(in_window):
              raise SystemExit("FAIL: candidate includes unexpected games outside selected window")
          PY
      - name: Confirm audit ran on staging and published nothing
        run: |
          test "$(git branch --show-current)" = "staging-archive-safety-2026-11-22"
          echo "PASS: all changes are isolated to this disposable Actions runner; no git push or commit was performed."
