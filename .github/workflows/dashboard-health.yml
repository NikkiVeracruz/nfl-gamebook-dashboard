name: Dashboard health monitor (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
permissions:
  contents: read
concurrency:
  group: read-only-dashboard-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify published league feed health
        run: python tests/production_health.py
      - name: Flag overdue final NFL games without gamebooks
        if: always()
        run: python tests/nfl_final_gamebooks.py
