name: 2026 official document verification (incremental, archive-safe)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/document_level_verification.py
      - tests/test_document_level_verification.py
      - .github/workflows/document-level-verification.yml
  schedule:
    # Daily inspection of not-yet-checked documents; recheck successes monthly.
    - cron: "31 10 * * *"

permissions:
  contents: write

concurrency:
  group: mega-board-document-verification-2026
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PDF reader and HTTP client
        run: python -m pip install "requests>=2.32,<3" "pypdf>=5,<7"
      - name: Test complete-document parsing, identity and archive safety rules
        run: python -m unittest discover -s tests -p 'test_document_level_verification.py' -v
      - name: Inspect official documents without modifying any source archive
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            limit=60
          else
            limit=450
          fi
          python -u tests/document_level_verification.py --limit "$limit" --workers 6
      - name: Review only the verification file for publication
        run: |
          git status --short
          git diff --check
          test -z "$(git status --porcelain -- archive.json gamebooks.json)"
      - name: Publish review statuses separately from the dashboard data
        run: |
          file="document-verification/2026.json"
          if [[ -z "$(git status --porcelain -- "$file")" && -z "$(git ls-files --others --exclude-standard -- "$file")" ]]; then
            echo "No new verification evidence"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$file"
          git diff --cached --check
          git commit -m "Record independent 2026 official document verification findings"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase -X theirs origin/main
            sleep 2
          done
          exit 1
