name: NFL archive-before-removal safety rehearsal (staging)
on:
  push:
    branches: [staging-archive-before-roll-2026-11-23]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check NFL rollover and archive-integrity code
        run: |
          python -m py_compile monitor.py archive.py
          python -m unittest discover -s tests -p 'test_nfl_archive_before_roll.py' -v
          python -m unittest discover -s tests -p 'test_archive_safety.py' -v
          python tests/archive_integrity_gate.py archive.json
      - name: Verify historical files unchanged by unit tests
        run: git diff --exit-code -- archive.json gamebooks.json archive-progress.json
