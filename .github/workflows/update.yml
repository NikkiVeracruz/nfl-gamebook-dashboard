name: Update NFL Gamebook Dashboard
on:
  workflow_dispatch:
  # BEGIN NFL CALENDAR-MANAGED SCHEDULE
  schedule:
    - cron: "*/5 * * * *"
  # END NFL CALENDAR-MANAGED SCHEDULE
permissions:
  contents: write
concurrency:
  group: update-gamebooks
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Skip NFL checks when no game or overdue gamebook needs attention
        id: poll
        env:
          NFL_FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if python nfl_calendar.py should-poll; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" -ne 3 ]; then exit "$code"; fi
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.poll.outputs.active == 'true'
        run: pip install -r requirements.txt
      - name: Check NFL gamebooks
        if: steps.poll.outputs.active == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python monitor.py
      - name: Update historical archive
        if: steps.poll.outputs.active == 'true'
        run: python archive.py
      - name: Block any loss of previously archived games or report links
        if: steps.poll.outputs.active == 'true'
        run: python tests/archive_integrity_gate.py archive.json
      - name: Publish updated data
        if: steps.poll.outputs.active == 'true'
        run: |
          if [[ -n "$(git status --porcelain gamebooks.json archive.json monitor-state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gamebooks.json archive.json monitor-state.json
            git commit -m "Update current NFL gamebook links"
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              echo "Remote changed; rebasing and retrying push ($attempt)"
              git pull --rebase -X theirs origin main
              # Re-check against the freshly fetched remote after conflict resolution.
              python tests/archive_integrity_gate.py archive.json --baseline-ref FETCH_HEAD
              sleep 2
            done
            echo "Could not publish after retries" >&2
            exit 1
          fi
