name: Full 2026 independent game-coverage rehearsal
on:
  push:
    branches: [staging-data-coverage-2026-11-23]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate full-season comparison rules
        run: python -m unittest discover -s tests -p 'test_season_completeness.py' -v
      - name: Audit full 2026 official league schedules against archives (read-only)
        run: python tests/season_completeness.py --scope full --output coverage/full-rehearsal.json
      - name: Retain the report even if real data is found missing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-2026-rehearsal
          path: coverage/full-rehearsal.json
          if-no-files-found: warn
      - name: Confirm existing game data unchanged
        if: always()
        run: git diff --exit-code -- archive.json gamebooks.json archive-progress.json
