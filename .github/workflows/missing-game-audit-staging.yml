name: Independent missing-game audit (staging, read-only)
on:
  push:
    branches:
      - staging-reliability
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compare five published feeds with independent schedules
        run: python tests/missing_game_audit.py
