name: Refresh NFL game-date polling calendar
# Only the live workflow's enabled/disabled state changes; no workflow-file writes.
# Schedule activation is authorized by the Actions API; no workflow PAT is needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/nfl-calendar.yml
  schedule:
    - cron: "3 0 * * *"
      timezone: "America/New_York"
    - cron: "3 3 * * *"
      timezone: "America/New_York"
permissions:
  contents: write
  actions: write
concurrency:
  group: nfl-calendar-coordinator
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install only calendar lookup dependency
        run: pip install requests
      - name: Test cutoff, unusual weekdays and missing-PDF continuation
        run: python -m unittest discover -s tests -p 'test_nfl_calendar.py' -v
      - name: Refresh actual NFL game days, without editing workflow source
        run: python nfl_calendar.py refresh
      - name: Publish updated date cache only
        run: |
          git diff --exit-code -- .github/workflows/update.yml archive.json gamebooks.json archive-progress.json
          if [[ -z "$(git status --porcelain nfl-calendar.json)" ]]; then
            echo "NFL date cache unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl-calendar.json
          git commit -m "Refresh cached NFL game dates"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin main
            python nfl_calendar.py refresh
            git add nfl-calendar.json
            if ! git diff --cached --quiet; then
              git commit -m "Reconcile NFL date cache after concurrent update"
            fi
          done
          echo "Unable to publish NFL date cache" >&2
          exit 1
      - name: Enable or disable NFL monitor and backup watchdog together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python nfl_calendar.py should-poll; then
            desired="active"
          else
            code=$?
            if [ "$code" -ne 3 ]; then exit "$code"; fi
            desired="disabled"
          fi
          for workflow in update.yml nfl-backup-watchdog.yml; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq '.state')
            if [ "$desired" = "active" ] && [ "$state" != "active" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
              echo "Enabled $workflow for active NFL monitoring"
            elif [ "$desired" = "disabled" ] && [ "$state" = "active" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/disable"
              echo "Disabled $workflow for idle NFL calendar"
            else
              echo "$workflow already in desired state: $state"
            fi
          done
      - name: Bootstrap one NFL check after a calendar-controller release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python nfl_calendar.py should-poll; then
            gh workflow run update.yml --ref main
            echo "Requested an immediate scheduled-game PDF check"
          else
            echo "No NFL game or missing PDF; no bootstrap check"
          fi
