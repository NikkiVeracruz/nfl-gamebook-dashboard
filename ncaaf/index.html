<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCAA Gamebook Monitor</title><style>:root{color-scheme:dark;font-family:system-ui;background:#0a1020;color:#f1f5ff}body{max-width:1100px;margin:auto;padding:24px}a{color:#8dc6ff}header{border-bottom:2px solid #2184ff;padding-bottom:16px}select,input{background:#182943;color:white;border:1px solid #527399;border-radius:7px;padding:12px;margin:8px 8px 8px 0}article{background:#14243c;border:1px solid #365170;padding:16px;border-radius:10px;margin:10px 0}small,p{color:#adc0d7}.pill{border-radius:6px;background:#304666;padding:4px 8px}h1{margin-bottom:4px}</style></head><body><header><a href="../command-center/">← Command Center</a><h1 id="title">NCAA Gamebook Monitor</h1><p>Unofficial monitoring · Forward archive begins November 21, 2026 · Only verified official gamebook links will be marked available.</p></header><section><h2>Current games</h2><input id="q" placeholder="Search teams or matchups"><select id="division" hidden><option value="">All subdivisions</option><option value="FBS">FBS</option><option value="FCS">FCS</option></select><div id="current">Loading…</div></section><section><h2>Archive</h2><p>Search or select a season to show archived games.</p><input id="aq" placeholder="Search archived teams"><select id="year"><option value="">All seasons</option></select><div id="archive">Search to view games.</div></section><script>
const league=location.pathname.split('/').filter(Boolean).at(-1).toUpperCase(),base=location.pathname.replace(/index\.html$/,'');document.getElementById('title').textContent=league==='NCAAF'?'NCAA Football':league==='NCAAMB'?"NCAA Men's Basketball":"NCAA Women's Basketball";let current=[],history=[];const el=id=>document.getElementById(id);const safe=u=>{try{const x=new URL(u);return x.protocol==='https:'?x.href:null}catch{return null}};function season(g){const d=new Date(g.date+'T12:00:00Z');return d.getUTCMonth()>=6?d.getUTCFullYear():d.getUTCFullYear()-1}function card(g){const e=document.createElement('article');const h=document.createElement('strong');h.textContent=g.label;e.append(h);const p=document.createElement('p');p.textContent=g.date+' · '+g.status;e.append(p);const u=safe(g.pdf_url||g.gs_url);if(u){const a=document.createElement('a');a.href=u;a.textContent='Official gamebook';a.target='_blank';a.rel='noopener';e.append(a)}else{const s=document.createElement('small');s.textContent='Official gamebook not yet verified';e.append(s)}const details=safe(g.game_url);if(details){const p=document.createElement('p'),a=document.createElement('a');a.href=details;a.target='_blank';a.rel='noopener';a.textContent='Game details (ESPN, not an official gamebook)';p.append(a);e.append(p)}return e}function draw(){const q=el('q').value.toLowerCase(),aq=el('aq').value.toLowerCase(),y=el('year').value,c=el('current'),a=el('archive');c.replaceChildren();a.replaceChildren();let games=current.filter(g=>g.label.toLowerCase().includes(q));if(!games.length)c.textContent='No matching current games.';else games.forEach(g=>c.append(card(g)));if(!aq&&!y){a.textContent='Search or select a season to view archived games.';return}games=history.filter(g=>(!aq||g.label.toLowerCase().includes(aq))&&(!y||String(season(g))===y));if(!games.length)a.textContent='No matching archived games.';else games.slice(0,250).forEach(g=>a.append(card(g)))}async function load(){try{const [c,a]=await Promise.all(['gamebooks.json','archive.json'].map(async f=>{const r=await fetch(f+'?t='+Date.now());if(!r.ok)throw Error(r.status);return r.json()}));current=c.games||[];history=a.games||[];const years=[...new Set(history.map(season))].sort((a,b)=>b-a);for(const y of years)el('year').add(new Option(y,y));draw()}catch(e){el('current').textContent='Feed is initializing. Run the NCAA GitHub Actions workflow to populate it.';el('archive').textContent='Archive not yet initialized.'}}['q','aq','year'].forEach(id=>el(id).addEventListener('input',draw));load();setInterval(load,300000);
</script></body></html>
