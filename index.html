<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Gamebook Center</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#101827;color:#f3f6fc}body{margin:0}main{max-width:1000px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:2rem}.muted{color:#aab8ce}.pill{border:1px solid #475569;border-radius:100px;padding:7px 12px;font-size:.85rem}#games{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:24px}.game{border:1px solid #344256;background:#182438;border-radius:14px;padding:18px}.game h2{font-size:1.15rem;margin:0 0 12px}.game p{margin:6px 0 14px}.link{display:inline-block;background:#d7e9ff;color:#102139;text-decoration:none;font-weight:700;border-radius:8px;padding:10px 13px}.waiting{color:#cbd5e1}footer{margin-top:32px;font-size:.85rem;color:#aab8ce}</style></head><body><main><header><div><h1>NFL Gamebook Center</h1><p class="muted">Official NFL gamebook links • Current Thursday–Thursday window</p></div><span class="pill" id="updated">Awaiting first update</span></header><p id="window" class="muted"></p><section id="games" aria-live="polite"><p class="muted">Loading gamebooks…</p></section><footer>Unofficial resource. Gamebooks link to NFL-hosted PDFs. Availability depends on NFL publication.</footer></main><script>
const gamesEl=document.getElementById('games');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
async function load(){try{const response=await fetch('./gamebooks.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Data unavailable');const data=await response.json();gamesEl.replaceChildren();document.getElementById('window').textContent=data.window_label||'Current NFL week';document.getElementById('updated').textContent=data.updated_at?'Updated '+new Date(data.updated_at).toLocaleString():'Awaiting first update';if(!Array.isArray(data.games)||!data.games.length){gamesEl.append(el('p','muted','No gamebooks listed yet. The monitor has not populated this week.'));return}for(const game of data.games){const card=el('article','game');card.append(el('h2','',game.label||'NFL game'));if(game.date)card.append(el('p','muted',game.date));if(game.pdf_url&&/^https:\/\/(?:[a-z0-9-]+\.)*nfl\.com\//i.test(game.pdf_url)){const a=el('a','link','View official PDF');a.href=game.pdf_url;a.target='_blank';a.rel='noopener noreferrer';card.append(a)}else{card.append(el('p','waiting','Awaiting official gamebook'))}gamesEl.append(card)}}catch(e){gamesEl.replaceChildren(el('p','muted','The dashboard could not load gamebook data. Please try again later.'))}}load();setInterval(load,5*60*1000);
</script></body></html>
