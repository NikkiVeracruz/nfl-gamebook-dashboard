<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Gamebook Center</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#101827;color:#f3f6fc}body{margin:0}main{max-width:1000px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:2rem}.muted{color:#aab8ce}.pill{border:1px solid #475569;border-radius:100px;padding:7px 12px;font-size:.85rem}#games{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:24px}.game{border:1px solid #344256;background:#182438;border-radius:14px;padding:18px}.game h2{font-size:1.15rem;margin:0 0 12px}.game p{margin:6px 0 14px}.link{display:inline-block;background:#d7e9ff;color:#102139;text-decoration:none;font-weight:700;border-radius:8px;padding:10px 13px}.waiting{color:#cbd5e1}footer{margin-top:32px;font-size:.85rem;color:#aab8ce}
/* Fanatics-inspired independent theme; not an official Fanatics product. */
:root{color-scheme:dark;background:#090e17;color:#f7faff}body{background:radial-gradient(ellipse at 85% -15%,#12345c 0%,#090e17 46%);min-height:100vh}main{max-width:1100px;padding:40px 22px}header{border-bottom:1px solid #25364a;padding-bottom:24px;align-items:center}h1{font-size:clamp(1.65rem,3.5vw,2.5rem);font-weight:850;letter-spacing:-.035em;text-transform:uppercase}h1:before{content:"";display:inline-block;width:7px;height:29px;background:#1683ff;border-radius:3px;margin-right:13px;vertical-align:-4px}h2{letter-spacing:-.015em}.muted{color:#b2c2d5}.pill{background:#14243a;border:1px solid #34577e;color:#dceaff;font-weight:650}.day{color:#d7e9ff;border-left:3px solid #1683ff;padding-left:12px;text-transform:uppercase;letter-spacing:.06em;font-size:.94rem}.game{background:linear-gradient(155deg,#17283d,#111b2a);border:1px solid #2c4058;border-top:3px solid #1683ff;border-radius:12px;padding:20px;box-shadow:0 12px 28px #0003;transition:border-color .2s,transform .2s}.game:hover{border-color:#3d96ff;transform:translateY(-2px)}.game h2{color:#fff;font-size:1.1rem}.game p{line-height:1.5}.live-status{color:#73bcff!important;font-weight:750;font-variant-numeric:tabular-nums}.button,.link{display:inline-block;background:#147bff;color:#fff!important;border-radius:7px;border:1px solid #3294ff;padding:11px 14px;font-weight:750;text-decoration:none;transition:background .2s}.button:hover,.link:hover{background:#075bd1}.waiting{color:#bdc9d8}.notice{color:#dbe8f8}footer{border-top:1px solid #25364a;padding-top:18px}a:focus-visible{outline:3px solid #8ecaff;outline-offset:3px}@media(max-width:540px){main{padding:24px 14px}.game{padding:16px}header{gap:18px}}
</style></head><body><main><header><div><h1>NFL Gamebook Center</h1><p class="muted">Official NFL gamebook links • Current Thursday–Thursday window</p></div><span class="pill" id="updated">Awaiting first update</span></header><p id="window" class="muted"></p><section id="games" aria-live="polite"><p class="muted">Loading gamebooks…</p></section><footer>Unofficial resource. Gamebooks link to NFL-hosted PDFs. Availability depends on NFL publication.</footer></main><script>
const gamesEl=document.getElementById('games');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
async function load(){try{const response=await fetch('./gamebooks.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Data unavailable');const data=await response.json();gamesEl.replaceChildren();if(data.offseason){gamesEl.append(el('p','muted','Offseason — monitoring resumes automatically for preseason.'));return}document.getElementById('window').textContent=data.window_label||'Current NFL week';document.getElementById('updated').textContent=data.updated_at?'Updated '+new Date(data.updated_at).toLocaleString():'Awaiting first update';if(!Array.isArray(data.games)||!data.games.length){gamesEl.append(el('p','muted','No gamebooks listed yet. The monitor has not populated this week.'));return}for(const game of data.games){const card=el('article','game');card.append(el('h2','',game.label||'NFL game'));if(game.date)card.append(el('p','muted',game.date));if(game.pdf_url&&/^https:\/\/(?:[a-z0-9-]+\.)*nfl\.com\//i.test(game.pdf_url)){const a=el('a','link','View official PDF');a.href=game.pdf_url;a.target='_blank';a.rel='noopener noreferrer';card.append(a)}else{card.append(el('p','waiting','Awaiting official gamebook'))}card.dataset.gameDate=game.date||"";card.dataset.gameLabel=game.label||"";card.append(el('p','muted live-status','Checking live status…'));gamesEl.append(card)}}catch(e){gamesEl.replaceChildren(el('p','muted','The dashboard could not load gamebook data. Please try again later.'))}}load().then(refreshLive);setInterval(()=>load().then(refreshLive),5*60*1000);

/* Live scores are independent of the slower official-report publishing workflow.
   ESPN's public scoreboard is an unofficial, best-effort live status source. */
const LIVE_SPORT="football/nfl";
const liveCache=new Map();
const normalizeTeam=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function teamMatches(text,team){
  const name=normalizeTeam(text);
  const options=[team?.displayName,team?.name,team?.shortDisplayName].filter(Boolean).map(normalizeTeam);
  return options.some(x=>x.length>=4&&(name===x||name.includes(x)));
}
function matchEvent(card,event){
  const comp=event.competitions?.[0];
  if(!comp)return false;
  const home=comp.competitors?.find(t=>t.homeAway==="home")?.team;
  const away=comp.competitors?.find(t=>t.homeAway==="away")?.team;
  const label=card.dataset.gameLabel||"";
  const halves=label.split(/\s+@\s+/);
  if(halves.length===2)return teamMatches(halves[0],away)&&teamMatches(halves[1],home);
  return teamMatches(label,away)&&teamMatches(label,home);
}
function liveDescription(event){
  const s=event.status||{},type=s.type||{};
  const comp=event.competitions?.[0],teams=comp?.competitors||[];
  const away=teams.find(t=>t.homeAway==="away"),home=teams.find(t=>t.homeAway==="home");
  const state=type.state||"pre";
  let status=type.shortDetail||type.description||"Scheduled";
  if(state==="in"){
    if(LIVE_SPORT==="baseball/mlb"){
      status=type.shortDetail||type.detail||("Inning "+(s.period||""));
    }else if(s.displayClock&&s.displayClock!=="0.0"&&s.displayClock!=="0:00"){
      const unit=LIVE_SPORT==="hockey/nhl"?"P":"Q";
      status=unit+(s.period||"")+" — "+s.displayClock;
    }
    status="LIVE · "+status;
  }
  const score=(away?.score!=null&&home?.score!=null)?(" · "+(away.team?.abbreviation||"Away")+" "+away.score+" – "+(home.team?.abbreviation||"Home")+" "+home.score):"";
  return status+score;
}
async function refreshLive(){
  const cards=[...document.querySelectorAll(".game[data-game-date]")];
  if(!cards.length)return;
  const dates=[...new Set(cards.map(c=>c.dataset.gameDate))];
  const results=await Promise.all(dates.map(async day=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(day))return [];
    const key=day;
    if(liveCache.has(key)&&Date.now()-liveCache.get(key).time<25000)return liveCache.get(key).events;
    try{
      const url="https://site.api.espn.com/apis/site/v2/sports/"+LIVE_SPORT+"/scoreboard?dates="+day.replace(/-/g,"")+"&limit=100";
      const response=await fetch(url,{cache:"no-store"});
      if(!response.ok)throw Error("Scoreboard unavailable");
      const events=(await response.json()).events||[];
      liveCache.set(key,{time:Date.now(),events});
      return events;
    }catch(e){return liveCache.get(key)?.events||[]}
  }));
  const events=results.flat();
  for(const card of cards){
    const game=events.find(e=>e.date&&matchEvent(card,e)&&
      new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(e.date))===card.dataset.gameDate)
      ||events.find(e=>matchEvent(card,e)&&e.date?.slice(0,10)===card.dataset.gameDate);
    const target=card.querySelector(".live-status");
    if(target)target.textContent=game?liveDescription(game):"Live status unavailable";
  }
}
setInterval(refreshLive,30000);

</script></body></html>
