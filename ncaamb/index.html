<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCAA Gamebook Monitor</title><style>:root{color-scheme:dark;font-family:system-ui;background:#0a1020;color:#f1f5ff}body{max-width:1100px;margin:auto;padding:24px}a{color:#8dc6ff}header{border-bottom:2px solid #2184ff;padding-bottom:16px}select,input{background:#182943;color:white;border:1px solid #527399;border-radius:7px;padding:12px;margin:8px 8px 8px 0}article{background:#14243c;border:1px solid #365170;padding:16px;border-radius:10px;margin:10px 0}small,p{color:#adc0d7}.pill{border-radius:6px;background:#304666;padding:4px 8px}h1{margin-bottom:4px}.season-status{display:inline-block;margin:8px 0 4px;padding:6px 12px;border-radius:7px;font-size:.85rem;font-weight:700;letter-spacing:.04em;background:#174638;color:#9cf4c4}.season-status.offseason{background:#353846;color:#d3d6e1}.fanatics-brand{width:210px;height:82px;margin:-20px 0 -12px -35px}.fanatics-brand svg{width:100%;height:100%;display:block}@media(max-width:540px){.fanatics-brand{width:185px;height:72px;margin:-18px 0 -10px -30px}}</style></head><body><header><div class="fanatics-brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 969 433" role="img" aria-label="Fanatics logo"><path fill="white" fill-rule="evenodd" d="M681,213 680,280 697,281 698,214Z M788,212 776,216 769,223 767,228 768,240 775,248 781,251 803,255 805,261 800,265 790,265 781,262 775,257 766,270 771,275 782,280 801,281 809,279 819,272 823,263 822,251 814,242 801,238 788,237 784,231 790,227 800,227 809,232 817,218 807,213Z M732,213 721,217 711,227 706,243 707,257 712,268 719,275 735,281 751,280 763,273 755,260 747,264 737,264 732,262 725,254 724,243 727,236 735,230 744,229 755,233 762,220 749,213Z M563,223 556,238 556,255 561,268 568,275 584,281 596,281 606,277 609,281 626,281 625,213 609,213 607,216 592,212 580,213 570,217Z M585,229 592,228 600,230 608,239 609,250 607,256 599,263 583,263 574,253 574,240 576,236Z M535,217 527,213 518,212 509,214 500,220 499,213 482,214 483,281 500,280 500,241 503,235 511,229 519,229 528,237 529,280 547,280 547,239 543,226Z M406,224 401,233 399,251 403,265 413,276 428,281 440,281 451,276 453,281 470,280 469,213 453,213 451,217 443,213 424,213 414,217Z M426,230 433,228 441,229 450,236 453,247 452,253 446,261 440,264 429,264 419,256 417,242 421,234Z M285,203 273,200 260,200 212,211 184,214 184,217 228,285 231,287 222,241 246,234 259,234 265,236Z M637,198 638,267 642,274 649,279 656,281 670,281 670,265 661,265 655,261 655,232 670,231 670,213 656,213 654,198Z M684,184 679,191 681,199 688,203 694,202 699,196 698,187 692,183Z M402,180 341,181 342,281 359,281 360,238 391,238 391,220 359,219 359,198 402,197Z M314,160 304,152 282,144 262,144 209,156 189,158 168,157 144,153 169,194 174,196 201,195 260,181 276,181 296,187Z"/></svg></div><a href="../command-center/">← Command Center</a><h1 id="title">NCAA Gamebook Monitor</h1><div><span id="seasonStatus" class="season-status" role="status">Checking season…</span></div><p>Unofficial monitoring · Forward archive begins November 21, 2026 · Only verified official gamebook links will be marked available.</p></header><section><h2>Current games</h2><input id="q" placeholder="Search teams or matchups"><select id="division" hidden><option value="">All subdivisions</option><option value="FBS">FBS</option><option value="FCS">FCS</option></select><div id="current">Loading…</div></section><section><h2>Archive</h2><p>Search or select a season to show archived games.</p><input id="aq" placeholder="Search archived teams"><select id="year"><option value="">All seasons</option></select><div id="archive">Search to view games.</div></section><script>
const league=location.pathname.split('/').filter(Boolean).at(-1).toUpperCase(),base=location.pathname.replace(/index\.html$/,'');document.getElementById('title').textContent=league==='NCAAF'?'NCAA Football':league==='NCAAMB'?"NCAA Men's Basketball":"NCAA Women's Basketball";let current=[],history=[];const el=id=>document.getElementById(id);const seasonMonths={NCAAF:[8,9,10,11,12,1],NCAAMB:[11,12,1,2,3,4],NCAAWB:[11,12,1,2,3,4]};function updateSeasonStatus(){const month=Number(new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",month:"numeric"}).format(new Date()));const active=(seasonMonths[league]||[]).includes(month),status=el("seasonStatus");status.textContent=active?"ACTIVE SEASON":"OFFSEASON";status.classList.toggle("offseason",!active);return active}const safe=u=>{try{const x=new URL(u);return x.protocol==='https:'?x.href:null}catch{return null}};function season(g){const d=new Date(g.date+'T12:00:00Z');return d.getUTCMonth()>=6?d.getUTCFullYear():d.getUTCFullYear()-1}function card(g){const e=document.createElement('article');const h=document.createElement('strong');h.textContent=g.label;e.append(h);const p=document.createElement('p');p.textContent=g.date+' · '+g.status;e.append(p);const u=safe(g.pdf_url||g.gs_url);if(u){const a=document.createElement('a');a.href=u;a.textContent='Official gamebook';a.target='_blank';a.rel='noopener';e.append(a)}else{const s=document.createElement('small');s.textContent='Official gamebook not yet verified';e.append(s)}const details=safe(g.game_url);if(details){const p=document.createElement('p'),a=document.createElement('a');a.href=details;a.target='_blank';a.rel='noopener';a.textContent='Game details (ESPN, not an official gamebook)';p.append(a);e.append(p)}return e}function draw(){const active=updateSeasonStatus();const q=el('q').value.toLowerCase(),aq=el('aq').value.toLowerCase(),y=el('year').value,c=el('current'),a=el('archive');c.replaceChildren();a.replaceChildren();let games=current.filter(g=>g.label.toLowerCase().includes(q));if(!active){c.textContent='Offseason — current games resume during the next season. Archived reports remain searchable below.'}else if(!games.length)c.textContent='No matching current games.';else games.forEach(g=>c.append(card(g)));if(!aq&&!y){a.textContent='Search or select a season to view archived games.';return}games=history.filter(g=>(!aq||g.label.toLowerCase().includes(aq))&&(!y||String(season(g))===y));if(!games.length)a.textContent='No matching archived games.';else games.slice(0,250).forEach(g=>a.append(card(g)))}async function load(){try{const [c,a]=await Promise.all(['gamebooks.json','archive.json'].map(async f=>{const r=await fetch(f+'?t='+Date.now());if(!r.ok)throw Error(r.status);return r.json()}));current=c.games||[];history=a.games||[];const years=[...new Set(history.map(season))].sort((a,b)=>b-a);for(const y of years)el('year').add(new Option(y,y));draw()}catch(e){el('current').textContent='Feed is initializing. Run the NCAA GitHub Actions workflow to populate it.';el('archive').textContent='Archive not yet initialized.'}}['q','aq','year'].forEach(id=>el(id).addEventListener('input',draw));updateSeasonStatus();load();setInterval(load,300000);
</script></body></html>
